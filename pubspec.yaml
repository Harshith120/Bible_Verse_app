name: bible_verse_app
description: "A daily Bible verse Flutter application with REST API, SQLite caching, Firebase Auth, Unit & Widget tests, and GitHub Actions CI."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/
